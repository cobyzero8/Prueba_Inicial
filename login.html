<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso Docentes - Simulacros EBR</title>
  <script src="https://unpkg.com/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <style>
    :root {
      --bg-1: #0f172a;
      --bg-2: #1e293b;
      --card: #ffffff;
      --text: #0f172a;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-hover: #115e59;
      --accent: #d97706;
      --border: #e2e8f0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: radial-gradient(circle at top right, #134e4a 0%, var(--bg-1) 48%, var(--bg-2) 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
      color: var(--text);
    }
    .login-card {
      width: 100%;
      max-width: 420px;
      background: var(--card);
      border-radius: 18px;
      padding: 32px 28px;
      box-shadow: 0 24px 50px rgba(0, 0, 0, 0.35);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }
    .brand-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      background: #f0fdfa;
      color: var(--primary);
      border: 1px solid #99f6e4;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 0.3px;
      margin-bottom: 14px;
    }
    .brand-badge.is-admin-mode {
      background: #fffbeb;
      color: #b45309;
      border-color: #fde68a;
    }
    h1 {
      margin: 0 0 6px;
      font-size: 24px;
      font-weight: 800;
      color: var(--text);
    }
    .subtitle {
      margin: 0 0 24px;
      font-size: 14px;
      color: var(--muted);
      line-height: 1.45;
    }
    .field {
      margin-bottom: 16px;
    }
    .field label {
      display: block;
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.4px;
      color: #334155;
      margin-bottom: 6px;
    }
    .field input {
      width: 100%;
      padding: 12px 14px;
      border: 1.5px solid var(--border);
      border-radius: 10px;
      font-size: 15px;
      transition: border-color 0.2s, box-shadow 0.2s;
      background: #f8fafc;
    }
    .field input:focus {
      outline: none;
      background: #ffffff;
      border-color: var(--primary);
      box-shadow: 0 0 0 3px rgba(15, 118, 110, 0.15);
    }
    .btn-login {
      width: 100%;
      padding: 13px 16px;
      border: none;
      border-radius: 10px;
      background: var(--primary);
      color: #ffffff;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.2s, transform 0.1s;
      margin-top: 6px;
    }
    .btn-login:hover { background: var(--primary-hover); }
    .btn-login:active { transform: scale(0.99); }
    .btn-login:disabled { opacity: 0.65; cursor: not-allowed; }
    .btn-login.admin-btn { background: #b45309; }
    .btn-login.admin-btn:hover { background: #92400e; }
    .alert-error {
      background: #fef2f2;
      color: #b91c1c;
      border: 1px solid #fecaca;
      border-radius: 10px;
      padding: 11px 14px;
      font-size: 13px;
      margin-bottom: 16px;
      display: none;
    }
    .footer-actions {
      margin-top: 20px;
      padding-top: 16px;
      border-top: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      font-size: 13px;
    }
    .btn-link-admin {
      background: none;
      border: none;
      padding: 0;
      color: var(--accent);
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      text-decoration: underline;
    }
    .hint-text { color: var(--muted); font-size: 12px; }
  </style>
</head>
<body>
  <main class="login-card">
    <div id="brandBadge" class="brand-badge">🎓 PLATAFORMA DOCENTE · EBR</div>
    <h1 id="loginTitulo">Iniciar sesión</h1>
    <p id="loginSubtitulo" class="subtitle">Ingresa con tu usuario y contraseña asignados para acceder a los simulacros en <strong>🎓 PLATAFORMA DOCENTE · EBR</strong>.</p>

    <div id="loginError" class="alert-error"></div>

    <form id="docenteLoginForm" autocomplete="on">
      <div class="field">
        <label for="usuarioEmail">Usuario / Correo electrónico</label>
        <input type="email" id="usuarioEmail" name="username" placeholder="docente@correo.com" required autocomplete="username">
      </div>

      <div class="field">
        <label for="usuarioPassword">Contraseña</label>
        <input type="password" id="usuarioPassword" name="password" placeholder="••••••••" required autocomplete="current-password">
      </div>

      <button type="submit" id="btnEntrar" class="btn-login">Ingresar al simulador →</button>
    </form>

    <div class="footer-actions">
      <span id="hintFooter" class="hint-text">¿Eres administrador?</span>
      <button type="button" id="btnModoGestion" class="btn-link-admin">+ Gestionar docentes</button>
    </div>
  </main>

  <script>
    let irAGestion = false;

    function activarModoGestion(activar) {
      irAGestion = Boolean(activar);
      const badge = document.getElementById("brandBadge");
      const titulo = document.getElementById("loginTitulo");
      const sub = document.getElementById("loginSubtitulo");
      const btn = document.getElementById("btnEntrar");
      const toggle = document.getElementById("btnModoGestion");
      const hint = document.getElementById("hintFooter");
      const err = document.getElementById("loginError");
      err.style.display = "none";

      if (irAGestion) {
        badge.textContent = "🔐 MODO ADMINISTRADOR";
        badge.classList.add("is-admin-mode");
        titulo.textContent = "Acceso a Gestión";
        sub.innerHTML = "Ingresa tu correo y contraseña de <strong>Administrador</strong> para <strong>REGISTRAR DOCENTEShtml</strong>.";
        btn.textContent = "Entrar a Gestión de Docentes →";
        btn.classList.add("admin-btn");
        hint.textContent = "¿Entrar como docente?";
        toggle.textContent = "← Volver a ingreso normal";
        document.getElementById("usuarioEmail").focus();
      } else {
        badge.textContent = "🎓 PLATAFORMA DOCENTE · EBR";
        badge.classList.remove("is-admin-mode");
        titulo.textContent = "Iniciar sesión";
        sub.innerHTML = "Ingresa con tu usuario y contraseña asignados para acceder a los simulacros en <strong>🎓 PLATAFORMA DOCENTE · EBR</strong>.";
        btn.textContent = "Ingresar al simulador →";
        btn.classList.remove("admin-btn");
        hint.textContent = "¿Eres administrador?";
        toggle.textContent = "+ Gestionar docentes";
      }
    }

    document.addEventListener("DOMContentLoaded", async () => {
      const params = new URLSearchParams(window.location.search);
      if (params.get("motivo") === "inactividad") {
        const errorBox = document.getElementById("loginError");
        errorBox.textContent = "⏳ Tu sesión se cerró automáticamente por estar inactivo durante 20 minutos. Vuelve a ingresar.";
        errorBox.style.display = "block";
      }

      if (params.get("next") === "registro_docentes.html") {
        activarModoGestion(true);
      }

      document.getElementById("btnModoGestion").addEventListener("click", () => {
        activarModoGestion(!irAGestion);
      });

      if (!window.supabaseClient) return;
      const { data: { session } } = await window.supabaseClient.auth.getSession();
      if (session) {
        const check = await verificarVigenciaDocente(session.user.id);
        if (check.valido) {
          if (irAGestion && (check.rol === "admin" || check.rol === "administrador")) {
            window.location.replace("registro_docentes.html");
          } else if (!irAGestion) {
            window.location.replace("index.html");
          }
        }
      }
    });

    document.getElementById("docenteLoginForm").addEventListener("submit", async (e) => {
      e.preventDefault();
      const email = document.getElementById("usuarioEmail").value.trim();
      const password = document.getElementById("usuarioPassword").value;
      const errorBox = document.getElementById("loginError");
      const btn = document.getElementById("btnEntrar");

      errorBox.style.display = "none";
      btn.disabled = true;
      btn.textContent = "Verificando credenciales...";

      try {
        const { data, error } = await window.supabaseClient.auth.signInWithPassword({ email, password });
        if (error) throw error;

        const check = await verificarVigenciaDocente(data.user.id);
        if (!check.valido) {
          await window.supabaseClient.auth.signOut();
          throw new Error(check.mensaje);
        }

        const esAdmin = check.rol === "admin" || check.rol === "administrador";
        if (irAGestion && !esAdmin) {
          await window.supabaseClient.auth.signOut();
          throw new Error("⚠️ Acceso denegado: esta cuenta no tiene rol de Administrador.");
        }

        sessionStorage.setItem("docente_rol", check.rol || "docente");
        sessionStorage.setItem("docente_nombre", check.nombre || email);

        if (irAGestion && esAdmin) {
          window.location.replace("registro_docentes.html");
        } else {
          window.location.replace("index.html");
        }
      } catch (err) {
        errorBox.textContent = err.message || "No se pudo iniciar sesión.";
        errorBox.style.display = "block";
        btn.disabled = false;
        btn.textContent = irAGestion ? "Entrar a Gestión de Docentes →" : "Ingresar al simulador →";
      }
    });
  </script>
</body>
</html>
