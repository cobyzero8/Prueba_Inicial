<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Prueba Inicial — Simulacro Docente EBR</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app-shell">
    <header class="topbar">
      <div class="brand">
        <span class="brand-tag">EBR NIVEL INICIAL · NOMBRAMIENTO</span>
        <h1>Plataforma de Simulacros Docentes</h1>
        <p class="subtitle">Lecturas completas, confort visual y repaso inteligente de errores</p>
      </div>
      <div class="topbar-actions">
        <button id="btn-tema" type="button" class="theme-btn">🌙 Modo Noche</button>
        <div id="timer-box" class="timer-pill hidden" aria-live="polite">
          <span>⏱️</span>
          <span id="timer-display">00:00</span>
        </div>
      </div>
    </header>

    <!-- CONFIGURACIÓN -->
    <section id="setup-panel" class="panel">
      <div class="panel-head">
        <h2>Prepara tu sesión de estudio</h2>
        <span id="racha-chip" class="chip">Racha actual: 0 · Récord: 0</span>
      </div>

      <div class="config-grid">
        <div class="field">
          <label for="bloque-select">Cuadernillo</label>
          <select id="bloque-select"></select>
        </div>

        <div class="field">
          <label for="subprueba-select">Subprueba</label>
          <select id="subprueba-select">
            <option value="TODAS">Todas las preguntas cargadas</option>
            <option value="Comprensión Lectora">Comprensión Lectora</option>
            <option value="Razonamiento Lógico">Razonamiento Lógico</option>
            <option value="Conocimientos Curriculares y Pedagógicos de la Especialidad">
              Conocimientos Curriculares y Pedagógicos de la Especialidad
            </option>
          </select>
        </div>

        <div class="field">
          <label for="lectura-select">Filtrar por Lectura (Comprensión)</label>
          <select id="lectura-select">
            <option value="TODAS">Todas las lecturas cargadas</option>
            <option value="Texto 1">Texto 1 — La tejedora</option>
            <option value="Texto 2">Texto 2 — Marie-Olympe de Gouges</option>
            <option value="Texto 3">Texto 3 — Servicio educativo y mercado</option>
            <option value="Texto 4">Texto 4 — Industria azucarera y nutrición</option>
            <option value="Texto 5">Texto 5 — Escolarización vs. aprendizaje</option>
          </select>
        </div>

        <div class="field">
          <label for="modo-select">Modo de estudio</label>
          <select id="modo-select">
            <option value="practica">Práctica guiada (clave y feedback al instante)</option>
            <option value="examen">Simulacro cronometrado (calificación al final)</option>
          </select>
        </div>

        <div class="field">
          <label for="minutos-input">Tiempo límite (min, 0 = libre)</label>
          <input id="minutos-input" type="number" min="0" max="360" value="45" />
        </div>
      </div>

      <div id="bloque-info" class="info-card"></div>

      <div class="btn-row">
        <button id="btn-iniciar" type="button" class="btn btn-primary">Iniciar prueba</button>
        <button id="btn-limpiar-progreso" type="button" class="btn btn-ghost">Reiniciar progreso</button>
      </div>
    </section>

    <!-- RESOLUCIÓN -->
    <section id="quiz-panel" class="panel hidden">
      <div class="quiz-top">
        <div class="badges">
          <span id="badge-bloque" class="badge badge-teal"></span>
          <span id="badge-subprueba" class="badge badge-slate"></span>
          <span id="badge-racha" class="badge badge-amber">🔥 Racha: 0</span>
        </div>
        <div id="contador-pregunta" class="question-counter"></div>
      </div>

      <div class="progress-track">
        <div id="progress-fill" class="progress-fill"></div>
      </div>

      <article id="contexto-box" class="reading-box hidden">
        <div id="lectura-titulo" class="reading-header"></div>
        <div id="lectura-cuerpo" class="reading-body"></div>
      </article>

      <h3 id="enunciado-texto" class="question-title"></h3>

      <div id="alternativas-lista" class="options-list"></div>
      <div id="feedback-box" class="feedback-banner hidden"></div>

      <div class="btn-row nav-actions">
        <button id="btn-anterior" type="button" class="btn btn-secondary">← Anterior</button>
        <button id="btn-siguiente" type="button" class="btn btn-secondary">Siguiente →</button>
        <button id="btn-finalizar" type="button" class="btn btn-success">Finalizar y Ver Puntaje</button>
      </div>

      <div class="map-section">
        <div class="map-label">Avance rápido de preguntas en esta sesión</div>
        <div id="mapa-preguntas" class="question-map"></div>
      </div>
    </section>

    <!-- RESULTADOS -->
    <section id="results-panel" class="panel hidden">
      <div class="panel-head">
        <h2>Balance de tu Sesión</h2>
        <span id="resultado-subtitulo" class="chip"></span>
      </div>

      <div id="resumen-puntaje" class="stats-grid"></div>

      <div class="btn-row">
        <button id="btn-revisar-falladas" type="button" class="btn btn-warning">Ver solo errores / sin marcar</button>
        <button id="btn-reintentar-errores" type="button" class="btn btn-primary">↺ Reintentar errores</button>
        <button id="btn-ver-todas" type="button" class="btn btn-secondary">Ver todas</button>
        <button id="btn-volver-inicio" type="button" class="btn btn-ghost">Nueva sesión</button>
      </div>

      <div id="detalle-revision" class="review-list"></div>
    </section>
  </div>

  <script src="data/C01-EBRI-11.js"></script>
  <script src="app.js"></script>
</body>
</html>
